name: Release Build To UtauV REPO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        default: "0.0.0.0"
        type: string
      release:
        description: "Release"
        type: boolean
        default: true
      beta:
        description: "Beta"
        type: boolean
        default: false
      draft:
        description: "Draft"
        type: boolean
        default: false
      win_x64_directml:
        description: "Windows x64 DirectML"
        type: boolean
        default: true
      win_x64_cuda:
        description: "Windows x64 CUDA"
        type: boolean
        default: false
      win_x86:
        description: "Windows x86 DirectML"
        type: boolean
        default: false
      win_arm64:
        description: "Windows ARM64 DirectML"
        type: boolean
        default: false
      osx_x64:
        description: "macOS x64"
        type: boolean
        default: false
      osx_arm64:
        description: "macOS ARM64"
        type: boolean
        default: false
      linux_x64:
        description: "Linux x64"
        type: boolean
        default: true
      linux_arm64:
        description: "Linux ARM64"
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_NAME: ${{ inputs.version }}${{ inputs.beta && ' Beta' || '' }}
  REPO_URL: "https://github.com/emeraldsingers/UtauV"

jobs:
  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          WIN_X64_DIRECTML: ${{ inputs.win_x64_directml }}
          WIN_X64_CUDA: ${{ inputs.win_x64_cuda }}
          WIN_X86: ${{ inputs.win_x86 }}
          WIN_ARM64: ${{ inputs.win_arm64 }}
          OSX_X64: ${{ inputs.osx_x64 }}
          OSX_ARM64: ${{ inputs.osx_arm64 }}
          LINUX_X64: ${{ inputs.linux_x64 }}
          LINUX_ARM64: ${{ inputs.linux_arm64 }}
        run: |
          targets=()
          add() { targets+=("$1"); }
          [[ "$WIN_X64_DIRECTML" == true ]] && add '{"name":"win-x64-directml","rid":"win-x64","arch":"x64","os":"win","runs-on":"windows-latest","variant":"directml"}'
          [[ "$WIN_X64_CUDA" == true ]] && add '{"name":"win-x64-cuda","rid":"win-x64","arch":"x64","os":"win","runs-on":"windows-latest","variant":"cuda"}'
          [[ "$WIN_X86" == true ]] && add '{"name":"win-x86","rid":"win-x86","arch":"x86","os":"win","runs-on":"windows-latest","variant":"directml"}'
          [[ "$WIN_ARM64" == true ]] && add '{"name":"win-arm64","rid":"win-arm64","arch":"arm64","os":"win","runs-on":"windows-latest","variant":"directml"}'
          [[ "$OSX_X64" == true ]] && add '{"name":"osx-x64","rid":"osx-x64","arch":"x64","os":"osx","runs-on":"macos-15-intel"}'
          [[ "$OSX_ARM64" == true ]] && add '{"name":"osx-arm64","rid":"osx-arm64","arch":"arm64","os":"osx","runs-on":"macos-15-intel"}'
          [[ "$LINUX_X64" == true ]] && add '{"name":"linux-x64","rid":"linux-x64","arch":"x64","os":"linux","runs-on":"ubuntu-latest","linuxarch":"x86_64"}'
          [[ "$LINUX_ARM64" == true ]] && add '{"name":"linux-arm64","rid":"linux-arm64","arch":"arm64","os":"linux","runs-on":"ubuntu-latest","linuxarch":"aarch64"}'
          matrix=$(printf '%s\n' "${targets[@]}" | jq -sc '{arch:.}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: select-targets
    runs-on: ${{ matrix.arch.runs-on }}

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.select-targets.outputs.matrix).arch }}

    steps:
      # Setup
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Setup Node.js (for DMG)
        if: matrix.arch.os == 'osx'
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NSIS
        if: ${{ matrix.arch.os == 'win' }}
        shell: pwsh
        run: |
          choco install nsis --version=3.11 -y --no-progress
          "C:\Program Files (x86)\NSIS\Bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Patch Version
        uses: justalemon/VersionPatcher@v0.8
        with:
          version: ${{ inputs.version }}
          csproj-files: "OpenUtau/*.csproj"

      # Test
      - name: Run Tests
        run: dotnet test OpenUtau.Test

      # Build
      - name: Restore dependencies
        run: dotnet restore OpenUtau -r ${{ matrix.arch.rid }} -p:PublishTargetOs=${{ matrix.arch.os }} -p:OnnxRuntimeProvider=${{ matrix.arch.variant == 'cuda' && 'CUDA' || matrix.arch.variant == 'directml' && 'DirectML' || 'Default' }}

      - name: Publish (Windows and Linux)
        run: dotnet publish OpenUtau -c Release -r ${{ matrix.arch.rid }} --self-contained true -o bin/${{ matrix.arch.name }} -p:PublishTargetOs=${{ matrix.arch.os }} -p:OnnxRuntimeProvider=${{ matrix.arch.variant == 'cuda' && 'CUDA' || matrix.arch.variant == 'directml' && 'DirectML' || 'Default' }}
        if: ${{ matrix.arch.os != 'osx' }}

      - name: Publish (MacOS)
        run: dotnet msbuild OpenUtau -t:BundleApp -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.arch.rid }} -p:UseAppHost=true -p:SelfContained=true -p:OutputPath=../bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os == 'osx' }}

      # Write release channel info
      - name: Write release channel info
        run: |
          echo '{ "Beta": ${{ inputs.beta }} }' > "bin/${{ matrix.arch.name }}/prefs-default.json"

      # Windows DirectML
      - name: Download DirectML (Windows DirectML builds)
        if: matrix.arch.os == 'win' && matrix.arch.variant == 'directml'
        shell: cmd
        run: |
          curl -L https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -o Microsoft.AI.DirectML.nupkg
          mkdir Microsoft.AI.DirectML
          tar -xf Microsoft.AI.DirectML.nupkg -C Microsoft.AI.DirectML
          copy /y Microsoft.AI.DirectML\bin\${{ matrix.arch.arch }}-win\DirectML.dll bin\${{ matrix.arch.name }}

      # Windows CUDA
      - name: Download CUDA dependencies (Windows CUDA builds)
        if: matrix.arch.os == 'win' && matrix.arch.variant == 'cuda'
        shell: cmd
        run: |
          echo Downloading CUDA dependencies for win-x64-cuda build
          REM Add CUDA DLL downloads here when ready

      - name: Download VC Redist (Windows)
        if: matrix.arch.os == 'win'
        shell: cmd
        run: |
          curl -L https://aka.ms/vs/17/release/vc_redist.${{ matrix.arch.arch }}.exe -o vc_redist.${{ matrix.arch.arch }}.exe

      - name: Arrange portable layout (Windows and Linux)
        if: matrix.arch.os == 'win' || matrix.arch.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          SRC="bin/${{ matrix.arch.name }}"
          PAYLOAD="$SRC/.bin"
          mkdir -p "$PAYLOAD" "$SRC/Data"
          find "$SRC" -mindepth 1 -maxdepth 1 ! -name 'UtauV' ! -name 'UtauV.exe' ! -name 'prefs-default.json' ! -name '.bin' ! -name 'Data' -exec mv {} "$PAYLOAD/" \;
          if [ "${{ matrix.arch.os }}" = "win" ]; then
            mv "$SRC/UtauV.exe" "$PAYLOAD/UtauV.exe"
          else
            mv "$SRC/UtauV" "$PAYLOAD/UtauV"
          fi
          mv "$PAYLOAD" "$SRC/bin"
          if [ "${{ matrix.arch.os }}" = "linux" ]; then
            printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/bin/UtauV" "$@"' > "$SRC/UtauV"
            chmod +x "$SRC/UtauV"
          fi

      - name: Build portable launcher (Windows)
        if: matrix.arch.os == 'win'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=${{ matrix.arch.arch }} -host_arch=amd64 && rc /nologo /fo bin\${{ matrix.arch.name }}\UtauVLauncher.res OpenUtau\Assets\UtauVLauncher.rc && cl /nologo /O2 /DUNICODE /D_UNICODE /Fe:bin\${{ matrix.arch.name }}\UtauV.exe /Fo:bin\${{ matrix.arch.name }}\UtauVLauncher.obj OpenUtau\Assets\UtauVLauncher.c bin\${{ matrix.arch.name }}\UtauVLauncher.res && del /q bin\${{ matrix.arch.name }}\UtauVLauncher.res bin\${{ matrix.arch.name }}\UtauVLauncher.obj"

      # Create packages (zip)
      - name: Create portable package (zip)
        run: |
          cd bin/${{ matrix.arch.name }}
          7z a ../../UtauV-${{ matrix.arch.name }}.zip *

      - name: Create tar.gz for Linux
        if: matrix.arch.os == 'linux'
        run: |
          tar -czf UtauV-${{ matrix.arch.name }}.tar.gz -C bin/${{ matrix.arch.name }} .

      # Windows installer
      - name: Create Windows Installer
        if: matrix.arch.os == 'win'
        uses: joncloud/makensis-action@v5.0
        with:
          script-file: OpenUtau.nsi
          arguments: "-DPRODUCT_VERSION=${{ inputs.version }} -DARCH=${{ matrix.arch.arch }} -DBUILD_DIR=bin/${{ matrix.arch.name }} -DOUTPUT_NAME=UtauV-${{ matrix.arch.name }}.exe"

      # macOS DMG
      - name: Create macOS DMG (manual .app bundle)
        if: matrix.arch.os == 'osx'
        shell: bash
        run: |
          set -euo pipefail

          OUT="bin/${{ matrix.arch.name }}"
          APP="$OUT/UtauV.app"
          MACOS="$APP/Contents/MacOS"
          RES="$APP/Contents/Resources"

          echo "Building .app bundle from publish output in: $OUT"
          ls -la "$OUT" || true

          rm -rf "$APP"
          mkdir -p "$MACOS" "$RES"

          cp -R "$OUT/"* "$MACOS/"
          chmod +x "$MACOS/UtauV" || true

          if [ -f "OpenUtau/Assets/OpenUtau.icns" ]; then
            cp "OpenUtau/Assets/OpenUtau.icns" "$RES/UtauV.icns"
          fi

          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>UtauV</string>
            <key>CFBundleDisplayName</key><string>UtauV</string>
            <key>CFBundleIdentifier</key><string>asoqwer.UtauV</string>
            <key>CFBundleExecutable</key><string>UtauV</string>
            <key>CFBundleIconFile</key><string>UtauV.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>${{ inputs.version }}</string>
            <key>CFBundleShortVersionString</key><string>${{ inputs.version }}</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST

          echo "App bundle created at: $APP"
          find "$APP" -maxdepth 3 -print

          hdiutil create -fs HFS+ -srcfolder "$APP" -volname "UtauV" "UtauV-${{ matrix.arch.name }}.dmg"
          codesign -fvs - "UtauV-${{ matrix.arch.name }}.dmg" || true

      # Create Appimage
      - name: Install LinuxDeploy
        uses: AnimMouse/setup-appimage@v1
        with:
          name: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        if: ${{ matrix.arch.os == 'linux' }}

      - name: Create appimage
        if: ${{ matrix.arch.os == 'linux' }}
        run: |
          cp OpenUtau/Assets/OpenUtau.desktop bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}/UtauV.png
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}/.DirIcon
          cp OpenUtau/Assets/AppRun bin/${{ matrix.arch.name }}
          chmod 755 bin/${{ matrix.arch.name }}/AppRun
          ARCH=${{ matrix.arch.linuxarch }} linuxdeploy --appdir bin/${{ matrix.arch.name }} --output appimage

      # Appcast generation
      - name: Generate Appcast for Windows
        if: inputs.release && matrix.arch.os == 'win'
        shell: cmd
        run: |
          python appcast.py -v=${{ inputs.version }} -o=windows -r=${{ matrix.arch.name }} -f=UtauV-${{ matrix.arch.name }}.zip
          python appcast.py -v=${{ inputs.version }} -o=windows -r=${{ matrix.arch.name }}-installer -f=UtauV-${{ matrix.arch.name }}.exe

      - name: Generate Appcast for macOS
        if: inputs.release && matrix.arch.os == 'osx'
        run: |
          python appcast.py -v=${{ inputs.version }} -o=macos -r=${{ matrix.arch.name }} -f=UtauV-${{ matrix.arch.name }}.dmg

      - name: Generate Appcast for Linux
        if: inputs.release && matrix.arch.os == 'linux'
        run: |
          python appcast.py -v=${{ inputs.version }} -o=linux -r=${{ matrix.arch.name }} -f=UtauV-${{ matrix.arch.name }}.zip

      # Upload all artifacts
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.arch.name }}
          path: |
            UtauV-${{ matrix.arch.name }}.exe
            UtauV-${{ matrix.arch.name }}.zip
            UtauV-${{ matrix.arch.name }}.dmg
            UtauV-${{ matrix.arch.name }}.tar.gz
            bin/${{ matrix.arch.name }}/*.AppImage
            appcast.${{ matrix.arch.name }}*.xml

      - name: Create GitHub Release
        if: inputs.release && github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ inputs.beta }}
          draft: ${{ inputs.draft }}
          files: |
            UtauV-win-x64-directml.exe
            UtauV-win-x64-directml.zip
            UtauV-win-x64-cuda.exe
            UtauV-win-x64-cuda.zip
            UtauV-win-x86.exe
            UtauV-win-x86.zip
            UtauV-win-arm64.exe
            UtauV-win-arm64.zip
            UtauV-osx-x64.dmg
            UtauV-osx-arm64.dmg
            UtauV-linux-x64.zip
            UtauV-linux-x64.tar.gz
            UtauV-linux-arm64.zip
            UtauV-linux-arm64.tar.gz
            bin/linux-x64/*.AppImage
            bin/linux-arm64/*.AppImage
            appcast.*.xml
          body: |
            ## Downloads

            ### Windows

            **DirectML builds** (recommended for most users - works on all GPUs including AMD, Intel, and NVIDIA):
            - [Installer (64-bit DirectML)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-x64-directml.exe)
            - [Portable ZIP (64-bit DirectML)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-x64-directml.zip)
            - [Installer (32-bit)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-x86.exe)
            - [Portable ZIP (32-bit)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-x86.zip)
            - [Installer (ARM64)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-arm64.exe)
            - [Portable ZIP (ARM64)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-arm64.zip)

            **CUDA builds** (NVIDIA GPUs only - requires CUDA 12.x + cuDNN 9.x):
            - [Installer (64-bit CUDA)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-x64-cuda.exe)
            - [Portable ZIP (64-bit CUDA)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-win-x64-cuda.zip)

            > **⚠️ CUDA builds require additional setup!**
            > Follow this tutorial: [CUDA + cuDNN Installation Guide](https://docs.google.com/document/d/17FBZxb5J1tMN-gR7cO_b-UJ8XUL5Xs_e7NYv3ewTmOI)

            ### macOS
            - [Intel Mac (.dmg)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-osx-x64.dmg)
            - [Apple Silicon (.dmg)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-osx-arm64.dmg)

            ### Linux
            - [64-bit (.zip)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-linux-x64.zip)
            - [64-bit (.tar.gz)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-linux-x64.tar.gz)
            - [ARM64 (.zip)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-linux-arm64.zip)
            - [ARM64 (.tar.gz)](${{ env.REPO_URL }}/releases/download/${{ inputs.version }}/UtauV-linux-arm64.tar.gz)

            ---

            ## Which build should I download?

            **Windows users:**
            - **Most users**: Download **DirectML** builds - they work on all GPUs (AMD, Intel, NVIDIA) without extra setup
            - **NVIDIA GPU users who want maximum performance**: Download **CUDA** builds - requires CUDA 12.x + cuDNN 9.x installation
            - **32-bit systems**: Download x86 builds (DirectML only)
            - **ARM devices**: Download ARM64 builds (DirectML only)

            **macOS users:**
            - **Intel Macs**: Download osx-x64 (CPU-only)
            - **Apple Silicon (M1/M2/M3)**: Download osx-arm64 (CPU-only)
            - If you see "This app is damaged", run: `xattr -rc /Applications/UtauV.app`

            **Linux users:**
            - **Most systems**: Download linux-x64 (CPU-only by default, automatically uses CUDA if installed)
            - **ARM devices**: Download linux-arm64 (CPU-only)
            - **For CUDA acceleration on Linux**: Install CUDA 12.x + cuDNN 9.x, the build will automatically detect and use it

            ---

            ## CUDA Support Guide

            **Windows CUDA builds** require manual installation of CUDA toolkit and cuDNN.
            **Linux builds** will automatically use CUDA if it's installed on your system.
            **macOS builds** do not support CUDA acceleration.

            ### Installation Tutorial:
            **[CUDA + cuDNN Installation Guide](https://docs.google.com/document/d/17FBZxb5J1tMN-gR7cO_b-UJ8XUL5Xs_e7NYv3ewTmOI)**

            This guide covers:
            - Windows: CUDA 12.x + cuDNN 9.x installation
            - Linux: CUDA 12.x + cuDNN 9.x installation

            ---

            ## Getting Started
            - [Getting Started Guide](https://github.com/openutau/OpenUtau/wiki/Getting-Started)
            - [FAQ](https://github.com/openutau/OpenUtau/wiki/FAQ)

            ## Support
            - [UtauV Discord Server](https://discord.gg/n3tTNa6JVT)
            - [Original OpenUtau Discord](https://discord.gg/UfpMnqMmEM)

  notify-discord-release:
    needs: build
    if: ${{ inputs.release && !inputs.draft && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send release notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          RELEASE_NAME: ${{ env.RELEASE_NAME }}
          RELEASE_TAG: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.beta && 'beta' || 'stable' }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ inputs.version }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Set the DISCORD_RELEASES_WEBHOOK_URL repository secret before enabling notifications.');
              return;
            }
            const stable = process.env.RELEASE_CHANNEL === 'stable';
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                username: 'UtauV Releases',
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: `${stable ? 'Stable' : 'Beta'} release: ${process.env.RELEASE_NAME}`,
                  url: process.env.RELEASE_URL,
                  description: `Tag: [\`${process.env.RELEASE_TAG}\`](${process.env.RELEASE_URL})`,
                  color: stable ? 5763719 : 16753920,
                }],
              }),
            });
            if (!response.ok) {
              throw new Error(`Discord webhook returned ${response.status}: ${await response.text()}`);
            }
