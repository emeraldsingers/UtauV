name: Discord Commit Notifications

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit notifications
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Set the DISCORD_COMMITS_WEBHOOK_URL repository secret before enabling notifications.');
              return;
            }

            const pushedCommits = context.payload.commits ?? [];
            const before = context.payload.before;
            const firstParentCommits = new Set();
            let sha = context.payload.after;

            // A merge push includes commits from its second parent. Only announce
            // commits that become part of master's first-parent history.
            while (sha && sha !== before) {
              firstParentCommits.add(sha);
              const { data: commit } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
              });
              sha = commit.parents[0]?.sha;
            }

            const commits = pushedCommits.filter(commit => firstParentCommits.has(commit.id));
            if (commits.length === 0) {
              core.notice('This push has no first-parent commits to announce.');
              return;
            }

            async function post(payload) {
              for (let attempt = 0; attempt < 3; attempt++) {
                const response = await fetch(webhook, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify(payload),
                });
                if (response.ok) return;
                if (response.status === 429) {
                  const body = await response.json();
                  await new Promise(resolve => setTimeout(resolve, Math.ceil((body.retry_after ?? 1) * 1000)));
                  continue;
                }
                throw new Error(`Discord webhook returned ${response.status}: ${await response.text()}`);
              }
              throw new Error('Discord rate limit persisted after three attempts.');
            }

            for (const commit of commits) {
              const [subject = '(no commit message)', ...bodyLines] = (commit.message ?? '').split('\n');
              const body = bodyLines.join('\n').trim().slice(0, 4096);
              const { data: commitDetails } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: commit.id,
              });
              const author = commitDetails.author;
              const authorName = author?.login ?? commit.author?.name ?? context.actor;
              const authorEmbed = author?.avatar_url
                ? { name: authorName, icon_url: author.avatar_url }
                : { name: authorName };
              await post({
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: `[${context.payload.repository.full_name}] ${subject}`.slice(0, 256),
                  url: commit.url,
                  ...(body ? { description: body } : {}),
                  color: 5793266,
                  author: authorEmbed,
                }],
              });
            }
