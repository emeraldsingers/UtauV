name: Discord Commit Notifications

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send commit notifications
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_COMMITS_WEBHOOK_URL }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Set the DISCORD_COMMITS_WEBHOOK_URL repository secret before enabling notifications.');
              return;
            }

            const commits = context.payload.commits ?? [];
            if (commits.length === 0) {
              core.notice('This push has no commit payload to announce.');
              return;
            }

            async function post(payload) {
              for (let attempt = 0; attempt < 3; attempt++) {
                const response = await fetch(webhook, {
                  method: 'POST',
                  headers: { 'content-type': 'application/json' },
                  body: JSON.stringify(payload),
                });
                if (response.ok) return;
                if (response.status === 429) {
                  const body = await response.json();
                  await new Promise(resolve => setTimeout(resolve, Math.ceil((body.retry_after ?? 1) * 1000)));
                  continue;
                }
                throw new Error(`Discord webhook returned ${response.status}: ${await response.text()}`);
              }
              throw new Error('Discord rate limit persisted after three attempts.');
            }

            for (const commit of commits) {
              const message = (commit.message ?? '(no message)').split('\n')[0].slice(0, 1800);
              const { data: commitDetails } = await github.rest.repos.getCommit({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: commit.id,
              });
              const author = commitDetails.author;
              const authorName = author?.login ?? commit.author?.name ?? context.actor;
              const authorAvatar = author?.avatar_url ?? context.payload.sender?.avatar_url;
              await post({
                username: authorName,
                ...(authorAvatar ? { avatar_url: authorAvatar } : {}),
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: `New commit on ${context.ref.replace('refs/heads/', '')}`,
                  url: commit.url,
                  description: `[\`${commit.id.slice(0, 7)}\`](${commit.url}) ${message}`,
                  color: 5793266,
                  author: authorAvatar
                    ? { name: authorName, icon_url: authorAvatar }
                    : { name: authorName },
                  footer: { text: context.payload.repository.full_name },
                }],
              });
            }
