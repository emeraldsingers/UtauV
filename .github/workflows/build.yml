on:
  schedule:
    # Daily alpha build. Skipped if master has no new commits since the
    # last alpha release (see the next-version job below).
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        default: alpha
        options:
          - stable
          - beta
          - alpha
      version:
        description: "Version"
        default: "0.0.0"
        required: true
        type: string
      release:
        type: boolean
        default: false
        description: "Release"
      beta:
        type: boolean
        default: true
        description: "Beta"
      draft:
        type: boolean
        default: true
        description: "Draft"
      win_x64_directml:
        type: boolean
        default: true
        description: "Windows x64 DirectML"
      win_x64_cuda:
        type: boolean
        default: false
        description: "Windows x64 CUDA"
      win_arm64:
        type: boolean
        default: false
        description: "Windows ARM64 DirectML"
      osx_arm64:
        type: boolean
        default: false
        description: "macOS ARM64"
      linux_x64:
        type: boolean
        default: true
        description: "Linux x64"
      linux_arm64:
        type: boolean
        default: false
        description: "Linux ARM64"

# Keep same-trigger-type runs from overlapping, e.g. a slow scheduled build
# still running when the next day's cron fires.
concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  next-version:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.nv.outputs.channel }}
      version: ${{ steps.nv.outputs.version }}
      tag: ${{ steps.nv.outputs.tag }}
      name: ${{ steps.nv.outputs.name }}
      release: ${{ steps.nv.outputs.release }}
      draft: ${{ steps.nv.outputs.draft }}
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - id: check
        if: github.event_name == 'schedule'
        run: |
          latest_tag=$(git tag --list '*-alpha' | sort -V | tail -1)
          if [ -z "$latest_tag" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$(git rev-list -n 1 "$latest_tag")" = "$(git rev-parse HEAD)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - id: nv
        if: steps.check.outputs.skip != 'true'
        env:
          CHANNEL: ${{ github.event_name == 'schedule' && 'alpha' || inputs.channel }}
          VERSION: ${{ inputs.version }}
          RELEASE: ${{ github.event_name == 'schedule' && 'true' || inputs.release }}
          DRAFT: ${{ github.event_name == 'schedule' && 'false' || inputs.draft }}
        run: |
          set -u
          if [ "$CHANNEL" = alpha ]; then
            git ls-remote --tags origin > tags.txt
            version=$(python .github/scripts/next-version.py < tags.txt)
            tag="$version-alpha"
            name="${version%.*} Alpha"
          else
            if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+[.][0-9]+[.][0-9]+$'; then
              echo "::error::version must be X.Y.Z for the $CHANNEL channel (got '$VERSION')"
              exit 1
            fi
            version="$VERSION"
            if [ "$CHANNEL" = beta ]; then
              tag="$version-beta"
              name="$version Beta"
            else
              tag="$version"
              name="$version"
            fi
          fi
          {
            echo "channel=$CHANNEL"
            echo "version=$version"
            echo "tag=$tag"
            echo "name=$name"
            echo "release=$RELEASE"
            echo "draft=$DRAFT"
          } | tee -a "$GITHUB_OUTPUT" >> "$GITHUB_STEP_SUMMARY"

  select-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - id: targets
        env:
          WIN_X64_DIRECTML: ${{ github.event_name == 'schedule' && 'true' || inputs.win_x64_directml }}
          WIN_X64_CUDA: ${{ github.event_name == 'schedule' && 'false' || inputs.win_x64_cuda }}
          WIN_ARM64: ${{ github.event_name == 'schedule' && 'false' || inputs.win_arm64 }}
          OSX_ARM64: ${{ github.event_name == 'schedule' && 'false' || inputs.osx_arm64 }}
          LINUX_X64: ${{ github.event_name == 'schedule' && 'true' || inputs.linux_x64 }}
          LINUX_ARM64: ${{ github.event_name == 'schedule' && 'false' || inputs.linux_arm64 }}
        run: |
          targets=()
          add() { targets+=("$1"); }
          [[ "$WIN_X64_DIRECTML" == true ]] && add '{"name":"win-x64","rid":"win-x64","arch":"x64","os":"win","runs-on":"windows-latest","onnx_provider":"DirectML"}'
          [[ "$WIN_X64_CUDA" == true ]] && add '{"name":"win-x64-cuda","rid":"win-x64","arch":"x64","os":"win","runs-on":"windows-latest","onnx_provider":"CUDA"}'
          [[ "$WIN_ARM64" == true ]] && add '{"name":"win-arm64","rid":"win-arm64","arch":"arm64","os":"win","runs-on":"windows-latest","onnx_provider":"DirectML"}'
          [[ "$OSX_ARM64" == true ]] && add '{"name":"osx-arm64","rid":"osx-arm64","arch":"arm64","os":"osx","runs-on":"macos-15-intel","onnx_provider":"Default"}'
          [[ "$LINUX_X64" == true ]] && add '{"name":"linux-x64","rid":"linux-x64","arch":"x64","os":"linux","runs-on":"ubuntu-latest","linuxarch":"x86_64","onnx_provider":"Default"}'
          [[ "$LINUX_ARM64" == true ]] && add '{"name":"linux-arm64","rid":"linux-arm64","arch":"arm64","os":"linux","runs-on":"ubuntu-latest","linuxarch":"aarch64","onnx_provider":"Default"}'
          matrix=$(printf '%s\n' "${targets[@]}" | jq -sc '{arch:.}')
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: [next-version, select-targets]
    if: needs.next-version.outputs.skip != 'true'
    runs-on: ${{ matrix.arch.runs-on }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.select-targets.outputs.matrix).arch }}

    steps:
      # Setup
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x
            10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install NSIS via Chocolatey
        run: choco install nsis --version=3.11 --no-progress
        if: ${{ matrix.arch.os == 'win' }}
      - uses: justalemon/VersionPatcher@v0.7.1
        with:
          version: ${{ needs.next-version.outputs.version }}
          csproj-files: "OpenUtau/*.csproj"

      # Test
      - name: Test
        run: dotnet test OpenUtau.Test

      # Build
      - name: Restore
        run: dotnet restore OpenUtau -r ${{ matrix.arch.rid }} -p:OnnxRuntimeProvider=${{ matrix.arch.onnx_provider }}

      - name: Build (Windows and Linux)
        run: dotnet publish OpenUtau -c Release -r ${{ matrix.arch.rid }} --self-contained true -p:OnnxRuntimeProvider=${{ matrix.arch.onnx_provider }} -o bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os != 'osx' }}

      - name: Build (MacOS)
        run: dotnet msbuild OpenUtau -t:BundleApp -p:Configuration=Release -p:RuntimeIdentifier=${{ matrix.arch.rid }} -p:UseAppHost=true -p:SelfContained=true -p:OutputPath=../bin/${{ matrix.arch.name }}/
        if: ${{ matrix.arch.os == 'osx' }}
      
      - name: Add Liquid Glass icon (macOS)
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app
          chmod +x .github/scripts/add-liquid-glass-icon.sh
          .github/scripts/add-liquid-glass-icon.sh \
            bin/${{ matrix.arch.name }}/publish/OpenUtau.app \
            OpenUtau/Assets/OpenUtau.icon \
            OpenUtau
        if: ${{ matrix.arch.os == 'osx' }}
      
      - name: Write release channel info
        run: "@{Channel='${{ needs.next-version.outputs.channel }}'; Beta=$${{ needs.next-version.outputs.channel == 'beta' }}} | ConvertTo-Json > bin/${{ matrix.arch.name }}/prefs-default.json"
        shell: pwsh

      # Create Zip
      - name: DirectML
        shell: cmd
        run: |
          curl -L https://www.nuget.org/api/v2/package/Microsoft.AI.DirectML/1.15.4 -o Microsoft.AI.DirectML.nupkg
          mkdir Microsoft.AI.DirectML
          tar -xf Microsoft.AI.DirectML.nupkg -C Microsoft.AI.DirectML
          copy /y Microsoft.AI.DirectML\bin\${{ matrix.arch.arch }}-${{ matrix.arch.os }}\DirectML.dll bin\${{ matrix.arch.name }}\
        if: ${{ matrix.arch.os == 'win' && matrix.arch.onnx_provider == 'DirectML' }}

      - name: Set executable permission
        if: ${{ matrix.arch.os == 'win' || matrix.arch.os == 'linux' }}
        shell: bash
        run: |
          SRC="bin/${{ matrix.arch.name }}"
          PAYLOAD="$SRC/.bin"
          mkdir -p "$PAYLOAD" "$SRC/Data"
          find "$SRC" -mindepth 1 -maxdepth 1 ! -name 'UtauV' ! -name 'UtauV.exe' ! -name 'prefs-default.json' ! -name '.bin' ! -name 'Data' -exec mv {} "$PAYLOAD/" \;
          if [ "${{ matrix.arch.os }}" = "win" ]; then
            mv "$SRC/UtauV.exe" "$PAYLOAD/UtauV.exe"
          else
            mv "$SRC/UtauV" "$PAYLOAD/UtauV"
          fi
          mv "$PAYLOAD" "$SRC/bin"
          if [ "${{ matrix.arch.os }}" = "linux" ]; then
            printf '%s\n' '#!/bin/sh' 'exec "$(dirname "$0")/bin/UtauV" "$@"' > "$SRC/UtauV"
            chmod +x "$SRC/UtauV"
          fi

      - name: Build portable launcher
        if: ${{ matrix.arch.os == 'win' }}
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmd /c "`"$vs\Common7\Tools\VsDevCmd.bat`" -arch=${{ matrix.arch.arch }} -host_arch=amd64 && rc /nologo /fo bin\${{ matrix.arch.name }}\UtauVLauncher.res OpenUtau\Assets\UtauVLauncher.rc && cl /nologo /O2 /DUNICODE /D_UNICODE /Fe:bin\${{ matrix.arch.name }}\UtauV.exe /Fo:bin\${{ matrix.arch.name }}\UtauVLauncher.obj OpenUtau\Assets\UtauVLauncher.c bin\${{ matrix.arch.name }}\UtauVLauncher.res && del /q bin\${{ matrix.arch.name }}\UtauVLauncher.res bin\${{ matrix.arch.name }}\UtauVLauncher.obj"

      - name: Zip
        run: |
          cd bin/${{ matrix.arch.name }}
          7z a ../../UtauV-${{ matrix.arch.name }}.zip *
        if: ${{ matrix.arch.os == 'win' }}

      - name: Tar.gz
        run: |
          cd bin/${{ matrix.arch.name }}
          tar -czf ../../UtauV-${{ matrix.arch.name }}.tar.gz *
        if: ${{ matrix.arch.os == 'linux' }}

      # Create Installer
      - name: Get VC Redist
        run: |
          curl https://aka.ms/vs/17/release/vc_redist.${{ matrix.arch.arch }}.exe -o vc_redist.${{ matrix.arch.arch }}.exe
        if: ${{ matrix.arch.os == 'win' && matrix.arch.onnx_provider == 'DirectML' }}

      - name: Create Installer
        uses: joncloud/makensis-action@v4.1
        with:
          script-file: OpenUtau.nsi
          arguments: "-DPRODUCT_VERSION=${{ needs.next-version.outputs.version }} -DARCH=${{ matrix.arch.arch }} -DBUILD_DIR=bin/${{ matrix.arch.name }} -DOUTPUT_NAME=UtauV-${{ matrix.arch.name }}.exe"
        if: ${{ matrix.arch.os == 'win' && matrix.arch.onnx_provider == 'DirectML' }}

      # Create Dmg
      - name: Create Dmg
        run: |
          npm install -g create-dmg
          APP=$(find bin/${{ matrix.arch.name }}/publish -maxdepth 1 -name "*.app" -type d | head -1)
          if [ -z "$APP" ]; then
            APP=bin/${{ matrix.arch.name }}/publish/UtauV.app
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp -R bin/${{ matrix.arch.name }}/publish/* "$APP/Contents/MacOS/"
            cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>UtauV</string>
            <key>CFBundleDisplayName</key><string>UtauV</string>
            <key>CFBundleIdentifier</key><string>asoqwer.UtauV</string>
            <key>CFBundleExecutable</key><string>UtauV</string>
            <key>CFBundleIconFile</key><string>UtauV.icns</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleVersion</key><string>0.0.0</string>
            <key>CFBundleShortVersionString</key><string>0.0.0</string>
            <key>LSMinimumSystemVersion</key><string>10.13</string>
            <key>NSPrincipalClass</key><string>NSApplication</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          PLIST
          fi
          cp OpenUtau/Assets/OpenUtau.icns "$APP/Contents/Resources/UtauV.icns"
          create-dmg "$APP" || true
          mv *.dmg UtauV-${{ matrix.arch.name }}.dmg
          codesign -fvs - UtauV-${{ matrix.arch.name }}.dmg
        if: ${{ matrix.arch.os == 'osx' }}

      # Create Appimage
      - name: Install LinuxDeploy
        uses: AnimMouse/setup-appimage@v1
        with:
          name: linuxdeploy
          url: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        if: ${{ matrix.arch.os == 'linux' }}

      - name: Create appimage
        env:
          ARCH: ${{ matrix.arch.linuxarch }}
          LINUXDEPLOY_OUTPUT_APP_NAME: UtauV-linux
        run: |
          cp OpenUtau/Assets/OpenUtau.desktop bin/${{ matrix.arch.name }}
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}/UtauV.png
          cp OpenUtau/Assets/OpenUtau.png bin/${{ matrix.arch.name }}/.DirIcon
          cp OpenUtau/Assets/AppRun bin/${{ matrix.arch.name }}
          chmod 755 bin/${{ matrix.arch.name }}/AppRun
          linuxdeploy --appdir bin/${{ matrix.arch.name }} --output appimage
        if: ${{ matrix.arch.os == 'linux' }}

      # Upload Artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: UtauV-${{ matrix.arch.name }}.tar.gz
          path: UtauV-${{ matrix.arch.name }}.tar.gz
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'linux' }}

      - uses: actions/upload-artifact@v4
        with:
          name: UtauV-${{ matrix.arch.name }}.zip
          path: UtauV-${{ matrix.arch.name }}.zip
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'win' }}

      - uses: actions/upload-artifact@v4
        with:
          name: UtauV-${{ matrix.arch.name }}.exe
          path: UtauV-${{ matrix.arch.name }}.exe
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'win' && matrix.arch.onnx_provider == 'DirectML' }}
      
      - uses: actions/upload-artifact@v4
        with:
          name: UtauV-${{ matrix.arch.name }}.AppImage
          path: UtauV-linux-${{ matrix.arch.linuxarch }}.AppImage
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'linux' }}

      - uses: actions/upload-artifact@v4
        with:
          name: UtauV-${{ matrix.arch.name }}.dmg
          path: UtauV-${{ matrix.arch.name }}.dmg
        if: ${{ needs.next-version.outputs.release != 'true' && matrix.arch.os == 'osx' }}

      # Appcast
      - name: Appcast Windows
        shell: cmd
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=windows -r=${{ matrix.arch.name }} -f=UtauV-${{ matrix.arch.name }}.zip
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'win' }}

      - name: Appcast Windows installer
        shell: cmd
        run: python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=windows -r=${{ matrix.arch.name }}-installer -f=UtauV-${{ matrix.arch.name }}.exe
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'win' && matrix.arch.onnx_provider == 'DirectML' }}

      - name: Appcast MacOS
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=macos -r=${{ matrix.arch.name }} -f=UtauV-${{ matrix.arch.name }}.dmg
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'osx' }}

      - name: Appcast Linux
        run: |
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=linux -r=${{ matrix.arch.name }} -f=UtauV-${{ matrix.arch.name }}.tar.gz
          python appcast.py -v=${{ needs.next-version.outputs.version }} --tag=${{ needs.next-version.outputs.tag }} -o=linux -r=${{ matrix.arch.name }}-appimage -f=UtauV-linux-${{ matrix.arch.linuxarch }}.AppImage
        if: ${{ needs.next-version.outputs.release == 'true' && matrix.arch.os == 'linux' }}

      # Release
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.next-version.outputs.tag }}
          name: ${{ needs.next-version.outputs.name }}
          prerelease: ${{ needs.next-version.outputs.channel != 'stable' }}
          draft: ${{ needs.next-version.outputs.draft }}
          files: |
            appcast.${{ matrix.arch.name }}*.xml
            UtauV-linux-${{ matrix.arch.linuxarch }}.AppImage
            UtauV-${{ matrix.arch.name }}.*
          body: |
            See [Getting Started](https://github.com/emeraldsingers/UtauV/wiki/Getting-Started) for how to use.

            If you encountered issues, see [FAQ](https://github.com/emeraldsingers/UtauV/wiki/FAQ)

            ## macOS says "This app is damaged"
            Open a terminal and run `xattr -rc /Applications/OpenUtau.app`. Try opening OpenUtau again.
        if: ${{ needs.next-version.outputs.release == 'true' }}

  notify-discord-release:
    needs: [next-version, build]
    if: ${{ needs.next-version.outputs.release == 'true' && needs.next-version.outputs.draft != 'true' && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send release notification
        uses: actions/github-script@v7
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASES_WEBHOOK_URL }}
          RELEASE_NAME: ${{ needs.next-version.outputs.name }}
          RELEASE_TAG: ${{ needs.next-version.outputs.tag }}
          RELEASE_CHANNEL: ${{ needs.next-version.outputs.channel }}
          RELEASE_URL: https://github.com/${{ github.repository }}/releases/tag/${{ needs.next-version.outputs.tag }}
        with:
          script: |
            const webhook = process.env.DISCORD_WEBHOOK_URL;
            if (!webhook) {
              core.setFailed('Set the DISCORD_RELEASES_WEBHOOK_URL repository secret before enabling notifications.');
              return;
            }
            const stable = process.env.RELEASE_CHANNEL === 'stable';
            const response = await fetch(webhook, {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({
                username: 'UtauV Releases',
                allowed_mentions: { parse: [] },
                embeds: [{
                  title: `${stable ? 'Stable' : process.env.RELEASE_CHANNEL} release: ${process.env.RELEASE_NAME}`,
                  url: process.env.RELEASE_URL,
                  description: `Tag: [\`${process.env.RELEASE_TAG}\`](${process.env.RELEASE_URL})`,
                  color: stable ? 5763719 : 16753920,
                }],
              }),
            });
            if (!response.ok) {
              throw new Error(`Discord webhook returned ${response.status}: ${await response.text()}`);
            }
